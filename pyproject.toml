[project]
name = "skillvitals"
version = "0.1.0"
description = "Skill observability for Claude Code — see which skills fire, which are dormant, what they cost in context, and what's broken."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pk", email = "prasri.pk@gmail.com" }]
keywords = ["claude", "claude-code", "skills", "mcp", "observability", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/pk/skillvitals"
Repository = "https://github.com/pk/skillvitals"
Issues = "https://github.com/pk/skillvitals/issues"

[project.optional-dependencies]
# Opt-in: live activation testing and LLM-backed prescription rewrites.
llm = ["anthropic>=0.40"]

[project.scripts]
skillvitals = "skillvitals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillvitals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
